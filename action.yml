name: 'gimme-the-lint'
description: 'Polyglot progressive linting — only NEW violations above the baseline block CI'
author: 'TheGlitchKing'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  mode:
    description: 'progressive (staged changes) or full (entire codebase)'
    required: false
    default: 'full'
  fix:
    description: 'Auto-fix violations where the linter supports it'
    required: false
    default: 'false'
  strict:
    description: 'Fail when a linter is missing for code that is present'
    required: false
    default: 'false'
  verify:
    description: >
      Also run the checks that need a live database or network (e.g. alembic-check:
      "you changed a model and forgot to generate a migration"). These can never run
      in a git hook — a pre-commit hook that dials a database fails on an aeroplane —
      so CI is the only place they belong, and the only place credentials legitimately
      live. Supply them as env/secrets on the job; gimme-the-lint reads the
      environment and never a committed config.
    required: false
    default: 'false'
  node-version:
    description: 'Node.js version'
    required: false
    default: '22'
  python-version:
    description: 'Python version (for Ruff); leave blank to skip Python setup'
    required: false
    default: '3.13'
  working-directory:
    description: 'Working directory (defaults to repo root)'
    required: false
    default: '.'
  comment-on-pr:
    description: 'Post the linting summary as a PR comment'
    required: false
    default: 'true'

outputs:
  status:
    description: 'Overall result: pass or fail'
    value: ${{ steps.lint.outputs.status }}
  new-violations:
    description: 'Number of new violations above the baseline'
    value: ${{ steps.lint.outputs.new_violations }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Python
      if: inputs.python-version != ''
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # Linter binaries: gimme-the-lint idempotently skips any language whose
    # linter is absent (or fails it under --strict). Install the linters your
    # repo uses here, or rely on toolchains the runner already provides
    # (Go and Rust are preinstalled on GitHub-hosted runners).
    - name: Run progressive linting
      id: lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        ARGS=""
        [ "${{ inputs.mode }}" = "full" ] && ARGS="$ARGS --all"
        [ "${{ inputs.fix }}" = "true" ] && ARGS="$ARGS --fix"
        [ "${{ inputs.strict }}" = "true" ] && ARGS="$ARGS --strict"

        # CI is the one place the slower whole-app checks belong: it is not somebody's
        # keyboard, and a few seconds here costs nobody their flow. The commit hook
        # stays fast; the push hook runs these; CI runs them again against the merge.
        ARGS="$ARGS --stage=push"

        EXIT=0
        npx --yes @theglitchking/gimme-the-lint check $ARGS \
          2>&1 | tee /tmp/gimme-lint-output.log || EXIT=${PIPESTATUS[0]}

        NEW=$(grep -oE '[0-9]+ new violation' /tmp/gimme-lint-output.log \
          | head -1 | grep -oE '[0-9]+' || echo "0")
        echo "new_violations=$NEW" >> $GITHUB_OUTPUT

        if [ "$EXIT" -eq 0 ]; then
          echo "status=pass" >> $GITHUB_OUTPUT
        else
          echo "status=fail" >> $GITHUB_OUTPUT
          exit 1
        fi

    # The database-touching checks. A separate step, deliberately: if it fails, the
    # log says "your models and your migrations disagree" rather than burying it among
    # lint output — and a red build tells you which KIND of thing broke before you
    # open it.
    - name: Verify (database / network checks)
      if: inputs.verify == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx --yes @theglitchking/gimme-the-lint verify

    - name: Comment on PR
      if: always() && inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let output = 'No lint output captured.';
          try {
            output = fs.readFileSync('/tmp/gimme-lint-output.log', 'utf8');
          } catch { /* keep default */ }

          const status = '${{ steps.lint.outputs.status }}';
          const newViolations = '${{ steps.lint.outputs.new_violations }}';
          const icon = status === 'pass' ? ':white_check_mark:' : ':x:';

          let body = `## gimme-the-lint Results\n\n`;
          body += `${icon} **${status}** — ${newViolations} new violation(s) above the baseline\n`;
          if (parseInt(newViolations, 10) > 0) {
            body += `\n<details><summary>Lint output</summary>\n\n\`\`\`\n`;
            body += `${output.slice(-3000)}\n\`\`\`\n</details>\n`;
          }
          body += `\n---\n*Generated by [gimme-the-lint](https://github.com/TheGlitchKing/gimme-the-lint)*`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find((c) => c.body.includes('gimme-the-lint Results'));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
